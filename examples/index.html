<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlateMask demo</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
    input { font: 600 1.5rem ui-monospace, monospace; letter-spacing: .1em; padding: .5rem .75rem; width: 100%; box-sizing: border-box; }
    pre { background: #f4f4f4; padding: .75rem; }
  </style>
</head>
<body>
  <h1>PlateMask</h1>
  <label for="plate">France</label>
  <input id="plate" placeholder="AB-123-CD">
  <pre id="out"></pre>
  <script type="module">
    import { PlateMask } from '../src/index.js';
    import { FR } from '../src/presets/fr.js';
    const out = document.getElementById('out');
    try {
      new PlateMask('#plate', { preset: FR });
      document.getElementById('plate').addEventListener('platemask:change', (e) => {
        out.textContent = JSON.stringify(e.detail, null, 2);
      });
    } catch (err) {
      out.textContent = err.message;
    }
  </script>
</body>
</html>
